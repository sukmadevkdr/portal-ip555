<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sistem Informasi Manajemen Terpadu IP 555</title>

    <!-- Favicon Logo Resmi IP 555 -->
    <link rel="icon" type="image/png" href="https://ibb.co.com/Xxk0MzGZ">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background: #FFFFFF !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
        }

        /* 
         * Iframe responsif penuh 100vw & 100vh tanpa pergeseran offset (anti terpotong di sisi atas & kiri)
         */
        iframe {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border: 0 !important;
            outline: none !important;
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>

<body>
    <!-- Iframe dengan integrasi izin Kamera, Clipboard & Fullscreen (Delegasi Penuh tanda *) -->
    <iframe
        src="https://script.google.com/macros/s/AKfycbw0aMWWEy5pz4khvbiwOV73GH5R7DzDNNgMbhkdlSpIBkl70nbsfdDSgZbIbdLV3Er3/exec"
        allow="camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *; display-capture *" 
        title="Portal IP 555">
    </iframe>

    <script>
        // Dukungan Hardware & Gesture Back Button di Mobile/PWA
        window.addEventListener('load', function () {
            try {
                history.pushState({ app: 'portal_ip555' }, '');
            } catch (e) { }
        });

        window.addEventListener('popstate', function (e) {
            var iframe = document.querySelector('iframe');
            if (iframe && iframe.contentWindow) {
                // Teruskan sinyal Back fisik HP ke dalam aplikasi Google Apps Script
                iframe.contentWindow.postMessage({ type: 'MOBILE_BACK_PRESS' }, '*');
            }
            try {
                history.pushState({ app: 'portal_ip555' }, '');
            } catch (err) { }
        });

        // Terima sinyal auto close jika pengguna logout dari dashboard utama
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'APP_AUTO_CLOSE') {
                try {
                    window.close();
                } catch (e) { }
            }
        });
    </script>
</body>

</html>
