<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sistem Informasi Manajemen Terpadu IP 555</title>

    <!-- Favicon Logo Resmi IP 555 -->
    <link rel="icon" type="image/png" href="https://ibb.co.com/Xxk0MzGZ">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            position: relative;
        }

        /* 
         * Iframe Responsif Layar Penuh (Full Viewport):
         * Menampilkan tampilan aplikasi secara utuh dari puncak atas (top: 0) hingga bawah (height: 100%)
         * sehingga seluruh navbar, tombol toggle sidebar mobile, logo, dan konten tidak terpotong.
         */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <!-- Iframe dengan integrasi izin Kamera, Clipboard & Fullscreen (Delegasi Penuh tanda *) -->
    <iframe
        src="https://script.google.com/macros/s/AKfycbx_qw2il9Rm20mM9ILAaAiPBgzLjcTbQX7MzoJhzCmr-1_Tr43ifkH7clgg1zsB_NTp/exec"
        allow="camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *; display-capture *" 
        title="Portal IP 555">
    </iframe>

    <script>
        // Dukungan Hardware & Gesture Back Button di Mobile/PWA
        window.addEventListener('load', function () {
            try {
                history.pushState({ app: 'portal_ip555' }, '');
            } catch (e) { }
        });

        window.addEventListener('popstate', function (e) {
            var iframe = document.querySelector('iframe');
            if (iframe && iframe.contentWindow) {
                // Teruskan sinyal Back fisik HP ke dalam aplikasi Google Apps Script
                iframe.contentWindow.postMessage({ type: 'MOBILE_BACK_PRESS' }, '*');
            }
            try {
                history.pushState({ app: 'portal_ip555' }, '');
            } catch (err) { }
        });

        // Terima sinyal auto close jika pengguna logout dari dashboard utama
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'APP_AUTO_CLOSE') {
                try {
                    window.close();
                } catch (e) { }
            }
        });
    </script>
</body>

</html>
